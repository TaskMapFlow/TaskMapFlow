name: task_map_flow
description: "TaskMapFlow - Visual task and project management for students and professionals."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  firebase_core: ^3.8.1
  equatable: ^2.0.7
  firebase_auth: ^5.7.0
  shared_preferences: ^2.5.5
  cloud_firestore: ^5.6.12
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
