name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum permissions: read-only on repository contents.
permissions:
  contents: read

jobs:
  flutter-checks:
    name: Flutter Format, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test --coverage

  firebase-rules-tests:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test-rules/package.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Install test dependencies
        working-directory: test-rules
        run: npm install

      - name: Run Firestore rules tests (emulator)
        # --project flag uses a dummy project ID; emulator does not connect to production.
        run: |
          firebase emulators:exec \
            --only firestore,auth \
            --project taskmapflow-test \
            "cd test-rules && npm test"
