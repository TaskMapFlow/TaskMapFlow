name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-checks:
    name: Flutter Format, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test --coverage

  firebase-emulator-tests:
    name: Firebase Emulator Tests (Rules & Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21 for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test-rules/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14.26.0

      - name: Install test dependencies with npm ci
        working-directory: test-rules
        run: npm ci

      - name: Run Firestore & Storage Security Rules tests (emulator)
        run: |
          firebase emulators:exec \
            --only firestore,storage \
            --project demo-taskmapflow \
            "cd test-rules && npm run test:rules"

      - name: Run Firebase Auth Emulator SDK tests (emulator)
        run: |
          firebase emulators:exec \
            --only auth,firestore,storage \
            --project demo-taskmapflow \
            "cd test-rules && npm run test:auth"
